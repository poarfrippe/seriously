<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wall</title>
<style>
  body { background: #f3e7b0; }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(36px, 7vw, 90px) clamp(14px, 4vw, 40px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: clamp(26px, 5vw, 68px) clamp(18px, 4vw, 56px);
  }

  /* --w = width on desktop in px, scales with the viewport on small screens */
  figure {
    --w: 280;
    margin: 0;
    width: calc(var(--w) * 1px);
    max-width: 100%;
  }

  @media (max-width: 700px) {
    figure { width: calc(var(--w) * .155vw); }
  }

  figure img {
    display: block;
    width: 100%;
    object-fit: contain;
  }

  /* caption stays available for screen readers, but is not shown */
  figcaption {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<main>

  <!--
    HOW TO USE
    1. Put your photos in the same folder, e.g. photos/beach.jpg
    2. Replace each src="data:..." below with your own file: src="photos/beach.jpg"
    3. --w   = frame width in px on desktop (try 180 to 420)
       --r   = picture shape: 4 / 3 landscape, 3 / 4 portrait, 1 / 1 square
    4. Copy a whole <figure>...</figure> block to add another picture.
  -->

  <figure style="--w:340; --r:1 / 1">
    <div class="frame"><div class="mat">
      <img alt="christian" src="/seriousMedia/christ.jpg">
    </div></div>
    <figcaption>A good christian</figcaption>
  </figure>

  <figure style="--w:220; --r:3 / 4">
    <img alt="graduation TUW" src="/seriousMedia/framed_graduation.png">
    <figcaption>Graduation TU Wien</figcaption>
  </figure>

  <figure style="--w:260; --r:1 / 1">
    <img alt="ich in valencia" src="/seriousMedia/valencia.png">
    <figcaption>Me in Valencia</figcaption>
  </figure>

  <figure style="--w:300; --r:4 / 5">
      <img alt="a lake" src="/seriousMedia/lake.png">
    <figcaption>A lake</figcaption>
  </figure>

  <figure style="--w:200; --r:3 / 4">
    <img alt="enigma" src="/seriousMedia/enigma.png">
    <figcaption>Enigma and me at DTU</figcaption>
  </figure>

  <figure style="--w:380; --r:3 / 4">
    <img alt="a glacier" src="/seriousMedia/glacier.png">
    <figcaption>A glacier</figcaption>
  </figure>

</main>
</body>
</html>
